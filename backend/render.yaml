services:
  - type: web
    name: autoloc-pro-api
    env: node
    region: frankfurt
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: autoloc-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DB_PATH
        value: /data/database.sqlite
      - key: UPLOADS_DIR
        value: /data/uploads
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
